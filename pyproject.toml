[project]
name = "maschinenraum"
description = "Maschinenraum: verwaltet die Dienste eines Rechners an einem Ort, mit Oberfläche und optionaler Anbindung an die Leitstelle"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "pydantic>=2.7",
  "websockets>=13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
maschinenraum = "maschinenraum.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["maschinenraum*"]

[tool.setuptools.package-data]
"maschinenraum" = ["VERSION", "oberflaeche/**/*"]

[tool.setuptools.dynamic]
version = {attr = "maschinenraum.__version__"}
