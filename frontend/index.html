<!doctype html>
<html lang="de" data-theme="dunkel" data-palette="kraeftig" data-flaechen="kesselraum" data-blau="koenig" data-schrift="gross">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161413">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="%NAME%">
  <!-- Titel und Name aus marke.ts (eine Quelle, auch für das Manifest) -->
  <title>%TITEL%</title>
  <!-- Symbole für alle Geräte, abgeleitet aus symbol.svg (tools/symbole.py): ico für alte Browser, PNG für Safari
       und Android, SVG für moderne Browser, apple-touch-icon und Manifest für den Startbildschirm -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
